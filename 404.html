<!doctype html>
<html lang="ru" data-theme="system">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — steamd</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/assets/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&family=Roboto+Mono:wght@400&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,300..500,0..1,0&display=block">
  <link rel="stylesheet" href="/assets/site.css">
  <script>
    try {
      var t = localStorage.getItem('steamd-theme'); if (t) document.documentElement.dataset.theme = t;
      var l = localStorage.getItem('steamd-lang') || ((navigator.language || 'ru').slice(0, 2) === 'ru' ? 'ru' : 'en');
      document.documentElement.lang = l;
    } catch (e) {}
  </script>
  <style>
    body { min-height: 100vh; display: flex; flex-direction: column; }
    .nf {
      flex: 1; display: grid; place-items: center;
      padding: 32px 16px;
    }
    .nf-card {
      width: min(560px, 100%);
      padding: 40px 32px 32px;
      border-radius: 28px;
      background: var(--md-sys-color-surface-container-low);
      text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }
    .nf-art { position: relative; width: 200px; height: 200px; }
    .nf-art svg { width: 100%; height: 100%; }
    .nf-art .track { fill: none; stroke: var(--md-sys-color-outline-variant); stroke-width: 6; stroke-dasharray: 2 8; stroke-linecap: round; }
    .nf-art .arc {
      fill: none; stroke: var(--md-sys-color-primary); stroke-width: 6; stroke-linecap: round;
      stroke-dasharray: 120 400; transform-origin: 100px 100px;
      animation: spin 2.4s cubic-bezier(.4, 0, .2, 1) infinite;
    }
    .nf-art .code {
      position: absolute; inset: 0; display: grid; place-content: center;
      font: 300 56px/1 var(--md-ref-typeface-brand); letter-spacing: 6px; padding-left: 6px;
      color: var(--md-sys-color-on-surface);
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .nf-art .arc { animation: none; } }
    .nf h1 { margin-top: 8px; }
    .nf p { color: var(--md-sys-color-on-surface-variant); max-width: 40ch; }
    .nf-path {
      font: 13px/1.5 'Roboto Mono', monospace;
      padding: 6px 12px; border-radius: 8px; max-width: 100%; overflow-wrap: anywhere;
      background: var(--md-sys-color-surface-container-highest); color: var(--md-sys-color-on-surface-variant);
    }
    .nf-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 8px; }
    .nf-links { margin-top: 4px; }
    .nf-top { display: flex; align-items: center; height: 64px; padding: 0 16px; }
    @media (max-width: 480px) { .nf-card { padding: 32px 20px 24px; } .nf-art { width: 168px; height: 168px; } .nf-art .code { font-size: 46px; } }
  </style>
</head>
<body>
  <header class="nf-top">
    <a class="brand" href="/" aria-label="steamd">
      <img src="/assets/icon.svg" alt="" width="32" height="32">
      <span>steamd</span>
    </a>
  </header>

  <main class="nf">
    <section class="nf-card">
      <div class="nf-art" aria-hidden="true">
        <svg viewBox="0 0 200 200">
          <circle class="track" cx="100" cy="100" r="84"/>
          <circle class="arc" cx="100" cy="100" r="84"/>
        </svg>
        <div class="code">404</div>
      </div>
      <h1 class="md-typescale-headline-medium" data-i18n="title">Страница не найдена</h1>
      <p class="md-typescale-body-large" data-i18n="text">Такой страницы нет: возможно, ссылка устарела или в адресе опечатка.</p>
      <code class="nf-path" id="path"></code>
      <div class="nf-actions">
        <md-filled-button href="/">
          <md-icon slot="icon">home</md-icon><span data-i18n="home">На главную</span>
        </md-filled-button>
        <md-outlined-button href="/#install">
          <md-icon slot="icon">download</md-icon><span data-i18n="install">Установка</span>
        </md-outlined-button>
      </div>
      <div class="nf-links">
        <md-text-button href="https://github.com/JettaXP/steamd/issues" target="_blank">
          <md-icon slot="icon">bug_report</md-icon><span data-i18n="report">Сообщить о проблеме</span>
        </md-text-button>
      </div>
    </section>
  </main>

  <script type="module">
    import '/assets/material-web.js';
    import { argbFromHex, hexFromArgb, Hct, SchemeTonalSpot, MaterialDynamicColors } from '/assets/color-utils.js';

    const EN = {
      title: 'Page not found',
      text: 'This page does not exist: the link may be outdated or the address has a typo.',
      home: 'Home', install: 'Install', report: 'Report a problem',
    };
    const lang = document.documentElement.lang === 'en' ? 'en' : 'ru';
    if (lang === 'en') {
      document.querySelectorAll('[data-i18n]').forEach((el) => { el.textContent = EN[el.dataset.i18n]; });
      document.title = '404 — steamd';
    }
    document.getElementById('path').textContent = decodeURI(location.pathname);

    let seed = '';
    try { seed = localStorage.getItem('steamd-seed') || ''; } catch (e) {}
    if (/^#[0-9A-F]{6}$/i.test(seed)) {
      const tokens = ['primary', 'onPrimary', 'primaryContainer', 'onPrimaryContainer', 'secondaryContainer',
        'onSecondaryContainer', 'surface', 'onSurface', 'onSurfaceVariant', 'outline', 'outlineVariant',
        'surfaceContainerLow', 'surfaceContainer', 'surfaceContainerHigh', 'surfaceContainerHighest'];
      const kebab = (n) => n.replace(/[A-Z]/g, (c) => '-' + c.toLowerCase());
      const css = (dark) => {
        const s = new SchemeTonalSpot(Hct.fromInt(argbFromHex(seed)), dark, 0);
        return tokens.map((t) => `--md-sys-color-${kebab(t)}:${hexFromArgb(MaterialDynamicColors[t].getArgb(s))};`).join('');
      };
      const light = css(false), dark = css(true);
      const style = document.createElement('style');
      style.textContent = `:root[data-theme="light"]{${light}}:root[data-theme="dark"]{${dark}}`
        + `@media (prefers-color-scheme: light){:root[data-theme="system"]{${light}}}`
        + `@media (prefers-color-scheme: dark){:root[data-theme="system"]{${dark}}}`;
      document.head.appendChild(style);
    }
  </script>
</body>
</html>
