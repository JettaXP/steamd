name: Android app

on:
  push:
    branches: [main]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: android
    env:
      STEAMD_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Patcher tests
        run: ./gradlew :patcher:test --console=plain
      - name: Signed release APK
        if: ${{ github.event_name != 'pull_request' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.STEAMD_KEYSTORE_BASE64 }}
          STEAMD_KEYSTORE_PASSWORD: ${{ secrets.STEAMD_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::STEAMD_KEYSTORE_BASE64 secret is not set: building a debug APK instead"
            ./gradlew :app:assembleDebug --console=plain
            mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/steamd-debug.apk
            exit 0
          fi
          KS="$RUNNER_TEMP/steamd.p12"
          B64="$(printf '%s' "$KEYSTORE_BASE64" | tr -cd 'A-Za-z0-9+/')"
          while [ $(( ${#B64} % 4 )) -ne 0 ]; do B64="$B64="; done
          if ! printf '%s' "$B64" | base64 -d > "$KS" 2>/dev/null; then
            echo "::error::STEAMD_KEYSTORE_BASE64 is not valid base64: paste the whole content of STEAMD_KEYSTORE_BASE64.txt"
            exit 1
          fi
          export STEAMD_KEYSTORE_PASSWORD="$(printf '%s' "$STEAMD_KEYSTORE_PASSWORD" | tr -d ' \r\n\t')"
          if ! keytool -list -keystore "$KS" -storetype PKCS12 -storepass "$STEAMD_KEYSTORE_PASSWORD" -alias steamd > "$RUNNER_TEMP/ks.txt" 2>&1; then
            echo "::error::Cannot open the keystore: check STEAMD_KEYSTORE_PASSWORD and STEAMD_KEYSTORE_BASE64"
            exit 1
          fi
          grep -i "SHA-256" "$RUNNER_TEMP/ks.txt" || true
          STEAMD_KEYSTORE="$KS" ./gradlew :app:assembleRelease --console=plain
          rm -f "$RUNNER_TEMP/steamd.p12"
          mkdir -p out && cp app/build/outputs/apk/release/app-release.apk "out/steamd-${{ github.run_number }}.apk"
      - name: Debug APK (pull requests)
        if: ${{ github.event_name == 'pull_request' }}
        run: ./gradlew :app:assembleDebug --console=plain && mkdir -p out && cp app/build/outputs/apk/debug/app-debug.apk out/steamd-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: steamd-apk
          path: android/out/*.apk
      - name: GitHub release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          APK="out/steamd-${{ github.run_number }}.apk"
          if [ ! -f "$APK" ]; then
            echo "::warning::No signed APK, skipping the release"
            exit 0
          fi
          cp "$APK" "out/steamd-$TAG.apk"
          cp "$APK" "out/steamd.apk"
          git log -1 --pretty=%B | grep -v -E '^(Co-Authored-By|Claude-Session):' > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" "out/steamd-$TAG.apk" "out/steamd.apk" --title "steamd $TAG" --notes-file "$RUNNER_TEMP/notes.md" --target "$GITHUB_SHA" --latest
      - name: Site download link
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ github.run_number }}
        run: |
          gh release view "$TAG" > /dev/null 2>&1 || exit 0
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" \
            --jq '{tag: .tag_name, date: .published_at} + (.assets | map(select(.name | test("^steamd-v[0-9]+\\.apk$"))) | .[0] | {url: .browser_download_url, size: .size})' \
            > "$RUNNER_TEMP/latest.json"
          git fetch -q origin main
          git checkout -q -B site origin/main
          cp "$RUNNER_TEMP/latest.json" latest.json
          sed -i "s|<lastmod>[^<]*</lastmod>|<lastmod>$(date -u +%F)</lastmod>|" sitemap.xml
          git diff --quiet && exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -qam "Site: download link for $TAG"
          for attempt in 1 2 3 4 5; do
            git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0
            sleep $((attempt * 10))
          done
          exit 1
      - name: Telegram
        if: ${{ github.event_name != 'pull_request' }}
        continue-on-error: true
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID are not set, skipping"
            exit 0
          fi
          APK="out/steamd-v${{ github.run_number }}.apk"
          [ -f "$APK" ] || APK="$(ls out/*.apk | head -1)"
          CAPTION="steamd v${{ github.run_number }}: $(git log -1 --pretty=%s)"
          curl -sS --fail-with-body --retry 3 \
            -F chat_id="$TG_CHAT" \
            -F document=@"$APK;type=application/vnd.android.package-archive" \
            -F caption="$CAPTION" \
            "https://api.telegram.org/bot$TG_TOKEN/sendDocument" -o "$RUNNER_TEMP/tg.json"
          python3 -c "import json,sys; j=json.load(open(sys.argv[1])); print('sent' if j.get('ok') else j)" "$RUNNER_TEMP/tg.json"
